theme = "base16_transparent" # good default "base16_transparent"
[editor]
# scrolloff = 25
auto-format = true
continue-comments = false
gutters = ["diff", "diagnostics", "spacer"] # add "line-numbers", if needed

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true

[editor.auto-save]
focus-lost = true

[editor.lsp]
enable = true
display-messages = false
auto-signature-help = true
display-inlay-hints = true
display-signature-help-docs = false
snippets = true
goto-reference-include-declaration = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[editor.smart-tab]
enable = false

[keys.normal]

# Personal preference
# o = ["open_below", "normal_mode"]
# O = ["open_above", "normal_mode"]

"%" = "select_all"
G = "goto_file_end"
V = ["select_mode", "extend_to_line_bounds"]
"C-b" = []                                   # Unbinds Ctrl-b in normal mode

[keys.insert]
"C-y" = ["completion"]
"C-n" = ["move_line_down", "move_visual_line_down"]
"C-p" = ["move_line_up", "move_visual_line_up"]
"C-[" = ["normal_mode"]


[keys.insert.j]
"j" = ["normal_mode"]

# [keys.normal.space]
# "t" = [
#   "yank_to_clipboard",
#   ":sh tmux paste-buffer -t right; tmux send-keys -t right Enter",
# ]

# [keys.normal.space.t]
# "s" = ["yank_to_clipboard", ":sh send-to-zellij"]
# "r" = [":sh steel %[buffer_name]"]

[keys.normal.space.t]
"s" = ["yank_to_clipboard", ":sh ~/Bash-Scripts/wezterm-to-repl"]
"r" = [":sh uv run %[buffer_name]"]
"t" = [":sh echo $(uv run pytest -q --tb=line --disable-warnings)"]

[keys.normal.space.w]
"w" = [":write"]

[keys.normal.space.q]
"q" = [":quit-all"]

[keys.normal.space.l]
"s" = [":lsp-stop"]
"r" = [":lsp-restart"]
"w" = [":lsp-workspace-command"]
