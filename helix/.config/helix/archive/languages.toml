# LSP Server Config

[language-server.steel-language-server]
command = "steel-language-server"

[language-server.sqlfluff-lsp]
command = "sqlfluff-lsp"
args = ["--stdio"]

[language-server.sqlfluff-lsp.config]
dialect = "databricks"

[language-server.databricks-sql-lsp]
command = "databricks-sql-lsp"

[language-server.buffer-language-server]
command = "buffer-language-server"

[language-server.ccls-ls]
command = "ccls"

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

[language-server.vale-ls]
command = "vale-ls"

[language-server.markdown-oxide]
command = "markdown-oxide"

[language-server.pyrefly]
command = "pyrefly"
args = ["lsp"]

[language-server.pyre]
command = "pyre"
args = ["persistent"]

[language-server.ty]
command = "ty"
args = ["server"]

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.python.analysis]
typeCheckingMode = "standard"

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config.python.analysis]
typeCheckingMode = "standard"

# if you choose `ruff` itself
[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.pylyzer]
command = "pylyzer"
args = ["--server"]

[language-server.sqls]
command = "sqls"
args = ["--server"]

[[language]]
name = "scheme"
language-servers = ["steel-language-server"]

[[language]]
name = "go"
language-servers = ["gopls"]
formatter = { command = "goimports" }
auto-format = true

# Language Config
[[language]]
name = "c"
language-servers = ["ccls-ls"]
file-types = ["c", "h"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "cpp"
language-servers = ["ccls-ls"]
file-types = ["cpp", "cc", "cxx", "hpp", "hcc", "hxx"]
formatter = { command = 'clang-format' }
auto-format = true

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true

[[language]]
name = "python"
language-servers = ["pyright", "ty", "ruff", "buffer-language-server"]
formatter = { command = "ruff", args = ["format", "--line-length", "88", "-"] }
auto-format = false


[[language]]
name = "yaml"
file-types = ['yml', 'yaml']
formatter = { command = 'prettierd', args = ["--parser", "yaml"] }
auto-format = false
language-servers = [
  "yaml-language-server",
  "ansible-language-server",
  "buffer-language-server",
  "harper-ls",
]

[[language]]
name = "markdown"
language-servers = [
  "buffer-language-server",
  "markdown-oxide",
  "vale-ls",
  "harper-ls",
]

[[language]]
name = "lua"
formatter = { command = "stylua", args = ["-"] }
auto-format = true

[[language]]
name = "bash"
indent = { tab-width = 4, unit = "    " }
formatter = { command = 'shfmt', args = ["-i", "4"] }
auto-format = true

[[language]]
name = "html"
formatter = { command = 'prettierd', args = [".html"] }
language-servers = [
  { name = "superhtml", except-features = [
    "format",
  ] },
  "vscode-html-language-server",
]
auto-format = true

[[language]]
name = "css"
formatter = { command = 'prettierd', args = [".css"] }
auto-format = true

[[language]]
name = "nix"
formatter = { command = "nixpkgs-fmt" }

[[language]]
name = "nu"
auto-format = true
formatter = { command = "topiary", args = ["format", "--language", "nu"] }

[[grammar]]
name = "r"
source = { git = "https://github.com/r-lib/tree-sitter-r", rev = "main" }

[language-server.powershell-editor-services]
name = 'powershell-editor-services'
transport = 'stdio'
command = 'pwsh'
args = [
  '-NoLogo',
  '-NoProfile',
  '-Command',
  '/home/kmichaels/Software/PowerShellEditorServices/PowerShellEditorServices/Start-EditorServices.ps1 -SessionDetailsPath /home/kmichaels/Software/PowerShellEditorServices/PowerShellEditorServices.sessions.lsp.json -LanguageServiceOnly -Stdio',
]

[[language]]
name = 'powershell'
scope = 'source.ps1'
file-types = ['ps1', 'psm1', 'psd1']
roots = ['.git']
comment-token = '#'
indent = { tab-width = 4, unit = '    ' }
language-servers = ['powershell-editor-services']
formatter = { command = "pwshFmt", args = ["--stdin"] }
auto-format = false

[[language]]
name = "sql"
file-types = ["sql", "plsql"]
language-servers = [
  "buffer-language-server",
  "sqlfluff-lsp",
  "databricks-sql-lsp",
]
# formatter = { command = "sqlfmt", args = ["--line-length", "88", "-"] }
auto-format = false
